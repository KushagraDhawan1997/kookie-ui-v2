name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser project needs a real engine. Without this the suite does not fail
      # loudly-but-partially — it launches nothing, and the laws that only a browser can
      # answer (var-chain resolution, inherits:false, tier arbitration) never run.
      - run: pnpm --filter @kookie-ui/react exec playwright install --with-deps chromium
      - run: pnpm run ci
