packages:
  - packages/*
  - apps/*

allowBuilds:
  esbuild: true

# Security floors for transitive dependencies, until their parents ship them (2026-10-22, `pnpm audit`).
overrides:
  source-map-js: ">=1.2.2"
  "@modelcontextprotocol/server": ">=2.3.0"

patchedDependencies:
  '@base-ui/react@1.7.0': patches/@base-ui__react@1.7.0.patch
